<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>팀핏 (TeamFit) - 대학생 팀플 역할 분담 & 모니터링</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f5f6f8] text-[#191f28]">
  <div class="app-container">
    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-[#f0f2f5] px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <!-- Cute Fitty Mascot Logo -->
        <div class="w-9 h-9 rounded-2xl bg-amber-100 flex items-center justify-center shadow-xs border border-amber-200/70 relative">
          <svg class="w-7 h-7" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="18" cy="19" r="13" fill="#FCD34D"/>
            <circle cx="11" cy="21" r="2.2" fill="#F87171" opacity="0.6"/>
            <circle cx="25" cy="21" r="2.2" fill="#F87171" opacity="0.6"/>
            <circle cx="13" cy="17" r="1.8" fill="#1F2937"/>
            <circle cx="23" cy="17" r="1.8" fill="#1F2937"/>
            <circle cx="13.5" cy="16.5" r="0.6" fill="#FFFFFF"/>
            <circle cx="23.5" cy="16.5" r="0.6" fill="#FFFFFF"/>
            <ellipse cx="18" cy="20.5" rx="2.5" ry="1.6" fill="#F97316"/>
            <path d="M18 6C18 4 16.2 2.5 15.2 4C14.2 5.5 17 7 18 7Z" fill="#10B981"/>
            <path d="M18 6C18 4 19.8 2.5 20.8 4C21.8 5.5 19 7 18 7Z" fill="#34D399"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm font-extrabold text-[#191f28] tracking-tight">TeamFit</h1>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 border border-blue-100" id="headerDayBadge">Day 1</span>
          </div>
          <p class="text-[11px] text-[#8b95a1] truncate max-w-[180px] font-medium" id="headerProjectName">팀 프로젝트</p>
        </div>
      </div>
      <!-- Quick Action Links -->
      <div class="flex items-center gap-1.5" id="quickLinksContainer">
        <!-- Injected via JavaScript -->
      </div>
    </header>

    <!-- Main Navigation Bar -->
    <nav id="mainNavBar" class="hidden border-b border-[#f0f2f5] bg-white sticky top-[57px] z-20 px-2 py-1.5 flex gap-1 justify-around">
      <button onclick="switchScreen(1)" id="navBtnScreen1" class="py-1.5 px-3 text-xs font-semibold text-center rounded-xl transition-all">
        ⚙️ 설정
      </button>
      <button onclick="switchScreen(2)" id="navBtnScreen2" class="flex-1 py-1.5 text-xs font-semibold text-center rounded-xl transition-all">
        📋 오늘의 계획
      </button>
      <button onclick="switchScreen(3)" id="navBtnScreen3" class="flex-1 py-1.5 text-xs font-semibold text-center rounded-xl transition-all">
        📊 팀 모니터링
      </button>
      <button onclick="switchScreen(4)" id="navBtnScreen4" class="py-1.5 px-3 text-xs font-semibold text-center rounded-xl transition-all relative">
        🔄 재조율
        <span id="rebalanceNoticeDot" class="hidden absolute top-1.5 right-2 w-2 h-2 rounded-full bg-red-500"></span>
      </button>
    </nav>

    <!-- Content Area -->
    <main class="flex-1 p-4 pb-24 overflow-y-auto" id="screenContent">
      <div class="p-8 text-center text-xs text-[#8b95a1]">
        불러오는 중입니다...
      </div>
    </main>

    <!-- Floating Pill Toolbar (Toss/Apple Style Floating Dock) -->
    <div class="fixed bottom-4 left-0 right-0 max-w-[440px] mx-auto px-4 z-40 pointer-events-none">
      <div class="bg-white/95 backdrop-blur-md border border-[#e5e8eb] px-3 py-2 rounded-2xl shadow-xl flex items-center justify-between pointer-events-auto">
        <div class="flex items-center gap-1.5">
          <button onclick="advanceToNextDay()" class="px-2.5 py-1.5 bg-[#eff6ff] hover:bg-[#dbeafe] text-[#2563eb] text-xs font-bold rounded-xl flex items-center gap-1 transition">
            <i data-lucide="sun-medium" class="w-3.5 h-3.5"></i>
            <span>D+1 다음 날</span>
          </button>
          <button onclick="loadSampleData()" class="px-2.5 py-1.5 bg-[#f2f4f6] hover:bg-[#e5e8eb] text-[#4e5968] text-xs font-semibold rounded-xl flex items-center gap-1 transition">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-500"></i>
            <span>샘플 채우기</span>
          </button>
        </div>
        <button onclick="resetAllData()" class="px-2 py-1.5 text-[#8b95a1] hover:text-[#f04452] text-xs font-medium rounded-xl flex items-center gap-1 transition">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          <span>초기화</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Overlay -->
  <div id="modalOverlay" class="hidden fixed inset-0 z-50 bg-black/30 backdrop-blur-xs flex items-center justify-center p-4">
    <div id="modalBox" class="w-full max-w-xs bg-white rounded-3xl p-5 shadow-2xl space-y-4 fade-in border border-[#f0f2f5]">
      <!-- Injected by JavaScript -->
    </div>
  </div>

  <!-- Main JavaScript App Logic -->
  <script src="app.js"></script>
</body>
</html>
